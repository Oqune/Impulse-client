[versions]
agp = "8.13.0"
kotlin = "2.4.0"
composeBom = "2024.09.00"
coreKtx = "1.12.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.8.2"
material3 = "1.2.0"
fragmentKtx = "1.8.9"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
biometric = "1.1.0"
# Post-quantum crypto (ML-KEM / Kyber) + AES-GCM.
# 1.79+ is required: it ships ML-KEM-768 (org.bouncycastle.pqc...MLKEMParameterSpec)
# inside the bcprov multi-release jar.
bouncycastle = "1.79"
# Standalone ML Kit Barcode scanning (com.google.mlkit:barcode-scanning).
# This is a different artifact from the previously used play-services variant
# (com.google.android.gms:play-services-mlkit-barcode-scanning). It bundles
# libbarhopper_v3.so whose ELF LOAD segments are 4 KB aligned; the align16kb
# post-build task re-aligns it to 16 KB so the APK is compatible with Android
# 15+ (16 KB page) devices. The Kotlin API (com.google.mlkit.vision.barcode.*)
# is identical, so no code changes are needed in QrScanScreen.kt.
mlkitBarcode = "17.3.0"
# Room (local DB)
room = "2.8.4"
# Coroutines
coroutines = "1.11.0"
    # WorkManager (expedited boot-time start of the foreground service on Android 14+)
    workmanager = "2.10.0"
    # Structured logging (Timber) with custom trees (debug/file/release).
    timber = "5.0.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-util = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
    workmanager = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }
    timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt" }
