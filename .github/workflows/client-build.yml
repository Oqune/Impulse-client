name: Client Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python (for 16 KB alignment)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing keystore from secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KS_B64" | base64 -d > keystore/impulse-release.jks
          echo -n "$KS_PASS" > keystore/keystore-password.txt
          ls -la keystore/

      - name: Build release APKs (all ABIs + universal)
        run: ./gradlew assembleRelease

      - name: Rename APKs with version/ABI
        run: |
          cd app/build/outputs/apk/release
          for f in app-*-release.apk; do
            abi=${f#app-}
            abi=${abi%-release.apk}
            mv "$f" "ImpulseClient-${GITHUB_REF_NAME}-${abi}-release.apk"
          done
          ls -la

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: impulse-client-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: impulse-client-release
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
